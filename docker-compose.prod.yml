services:
  backend:
    build:
      context: ./backend
    container_name: sigma-backend
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.prod}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
    container_name: sigma-celery-worker
    restart: unless-stopped
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.prod}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_DEFAULT_SEASON_ID: ${VITE_DEFAULT_SEASON_ID:-1}
        VITE_PERSONAL_DATA_STUDENT_URL: ${VITE_PERSONAL_DATA_STUDENT_URL:-}
        VITE_PERSONAL_DATA_TEACHER_URL: ${VITE_PERSONAL_DATA_TEACHER_URL:-}
    container_name: sigma-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: sigma-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sigma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sigma_redis_data:
